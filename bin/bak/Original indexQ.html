function startIE() {

	if (running == true) {  
		// already running so need to kill italic
		console.log("running = true");
		ws.close();
		
		// clean up icons/web ui
	}
	
	else {

		ws = new WebSocket('ws://' + host + ':8080/');
		ws.onopen = function() {
		  console.log("websocket opened");
		  loading = true;
		  restart_vpu = false;
		  send_settings();
		};
		ws.onclose = function() {
		  console.log("websocket closed");
		  if (restartvpu) {
			$("#videotag").html("VPU/System needs restarted");
			$("#frame").attr("src","img/sad_face.jpg");
		  }
		  else {
			$("#videotag").html("Not running (try to press F5)");
			$("#frame").attr("src","img/sad_face.jpg");
		  }
		  
		};
		ws.onmessage = function(event) {

		    if (event.data.indexOf("FRAME:") == 0) {
				if (loading) {
					$("#videotag").html("Live Video");
					loading = false;
				}
				// This is an image/jpeg
				prevFrame = currentFrame;
				currentFrame = "data:image/jpeg;chartset=utf-8;base64," + event.data.substring(6, event.data.length);
				$("#frame").attr("src",currentFrame);
				idleFrameCount++; 
				if (idleFrameCount > idleFrameMax) {
					// Reset logic if idle
					if (debug) {
						console.log("idle timeout");
					}
					/*  old implementation did not cover case for happy person just disappear
					wasHappy = false;
					candyGiven = false;
					$("#emotion").html("<h2>Emotion: </h2>");
					$("#countdown").html("<h2>Countdown: " + (candyDurationRequirement / 1000).toFixed(3) + " seconds</h2>");
					*/
					
					if ((wasHappy) && (duration >= candyDurationRequirement)) { // need to log this person
						happyCount++;
						happy4 = happy3;
						happy3 = happy2; 
						happy2 = happy1;
						happy1 = happyPerson;
						dur4 = dur3;
						dur3 = dur2;
						dur2 = dur1;
						dur1 = duration / 1000;
						$("#recent1").attr("src",happy1);
						$("#recent2").attr("src",happy2);
						$("#recent3").attr("src",happy3);
						$("#dur1").html(dur1 + " seconds");
						$("#dur2").html(dur2 + " seconds");
						$("#dur3").html(dur3 + " seconds");
						if (debug) {
							console.log("No longer happy!");
							console.log("DURATION: " + duration);
							console.log("HAPPYTIME: " + happyTime);
						}
						if (duration > happyTime) {
						  // New winner
						  happyTime = duration;
						  //happyPerson = currentFace; //prevFrame;
						  $("#winner").attr("src",happyPerson);
						  $("#wintime").html(happyTime/1000 + " seconds");
						}
						//console.log("SAVE THIS PERSON!");
					}
					wasHappy = false;
					candyGiven = false;
					$("#countdown").html("<h2>Countdown: " + (candyDurationRequirement / 1000).toFixed(3) + " seconds</h2>");	
					$("#emotion").html("<h2>Emotion: </h2>");
					
					
					
					
					
					
					
				}
		    }
			else if (event.data.indexOf("FACE:") == 0) {
				console.log("Got a new face!");
				// This is a face image, should be 300x300
				currentFace = "data:image/jpeg;chartset=utf-8;base64," + event.data.substring(5, event.data.length);
			}
			else {
		  		console.log("MESSAGE: " + event.data);
				  
				  
				if (event.data.indexOf("[ INFO ] Start inference") >= 0) {
					// candy_demo started streaming over websocket
					running = true; 
					
					console.log("Enabling settings button");
					// enable settings button
					$("#btnSettings").removeAttr('disabled');
					
					// change play button to stop button
					$("#btnPlayIcon").removeClass("fa-play");
					$("#btnPlayIcon").addClass("fa-stop");
				
				}
		  
				else if (event.data.indexOf("EDEVICE:") == 0) {
					// This is a response with the device type we are running
					device = event.data.substring(8, event.data.length);
					$("#titlestring").text(title + " running on the " + device);
				}

				else if (event.data.indexOf("EMOTION") == 0) {

					
					idleFrameCount = 0;
					temp_emotion = event.data.substring(8, event.data.length);
					
					
					// Smooth emotion here

					
					em_arr[em_pnt] = temp_emotion;
					em_pnt += 1;
					
					if (em_pnt >= em_buffer_size) {  
						em_pnt = 0;
					}
					var count = {};
					em_arr.forEach(function(i) { count[i] = (count[i]||0) + 1;});
					//console.log(count);
					
					
					// Max value...has issues transitioning between two entries
					// emotion = Object.keys(count).reduce(function(a, b){ return count[a] > count[b] ? a : b });



					
					// At least a certain threshold of last x frames 
					//  (set emotion_threshold lower than em_buffer_size and have em_buffer_size ~ 10 or so)

					// If last y frames are the same (set emotion_threshold == em_buffer_size, and lower to value like 5)
					
					Object.entries(count).forEach(([key, val]) => {
						if (val >= emotion_threshold) {
							emotion = key;
						}
					});
					
					
				
					
					//console.log(emotion);

					// End emotion smoothing
					
					$("#emotion").html("<h2>Emotion: " + emotion + "</h2>");
					if (emotion == "happy") {
						if (!wasHappy) { // starting being happy
							wasHappy = true;
							if (debug) {
								console.log("start being happy");
							}
							happyStart = Date.now();
							$("#emotion").html("<h2>Emotion: " + emotion + "</h2>");
						}
						if (wasHappy) {
							// Happy countdown timer
							currentTime = Date.now();
							duration = currentTime - happyStart;
							countdownTime = candyDurationRequirement - duration;
							if (countdownTime <= 0) {
								if (!candyGiven) {
									// Send candy message
									ws.send("candy:on");
									candyGiven = true;
									happyPerson = currentFace; //prevFrame;
									if (debug) {
										console.log("give candy!");
									}
								}
							  countdownTime = 0;
							}
							if (debug) {
								console.log("Happy current duration: " + duration);
							}
							
							$("#countdown").html("<h2>Countdown: " + (countdownTime / 1000).toFixed(3) + " seconds</h2>");
						}
					}
					else {  // not happy
						
						if ((wasHappy) && (duration >= candyDurationRequirement)) { // need to log this person
							happyCount++;
							happy4 = happy3;
							happy3 = happy2; 
							happy2 = happy1;
							happy1 = happyPerson;
							dur4 = dur3;
							dur3 = dur2;
							dur2 = dur1;
							dur1 = duration / 1000;
							$("#recent1").attr("src",happy1);
							$("#recent2").attr("src",happy2);
							$("#recent3").attr("src",happy3);
							$("#dur1").html(dur1 + " seconds");
							$("#dur2").html(dur2 + " seconds");
							$("#dur3").html(dur3 + " seconds");
							if (debug) {
								console.log("No longer happy!");
								console.log("DURATION: " + duration);
								console.log("HAPPYTIME: " + happyTime);
							}
							if (duration > happyTime) {
							  // New winner
							  happyTime = duration;
							  //happyPerson = currentFace; //prevFrame;
							  $("#winner").attr("src",happyPerson);
							  $("#wintime").html(happyTime/1000 + " seconds");
							}
							//console.log("SAVE THIS PERSON!");
						}
						wasHappy = false;
						candyGiven = false;
						$("#countdown").html("<h2>Countdown: " + (candyDurationRequirement / 1000).toFixed(3) + " seconds</h2>");
					}
				
				}
				else if (event.data.indexOf("global mutex initialization failed") >= 0) {
					restartvpu = true;
				}
				else {
					if (debug) {
						console.log("LOG: " + event.data);
					}
					if (loading) {
						$("#videotag").html("Starting inference engine...");
						$("#frame").attr("src","img/loader.gif");
						$("#frame").attr("height",480);
						$("#frame").attr("width",640);
						
						
						if( window.innerHeight == screen.height) {
							// browser is fullscreen
							
							$("#demo_description").html("<h4>" + datastring + "</h4>");
						}
						else {
							$("#demo_description").html("<h5>" + datastring + "</h5>");	
						}
						
					}

				}
			}
		};
	}
}
